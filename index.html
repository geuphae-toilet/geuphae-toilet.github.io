<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>급해</title>
  <meta name="apple-mobile-web-app-title" content="급해" />
  <meta name="application-name" content="급해" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000'/%3E%3Ctext x='32' y='45' font-size='38' font-weight='900' text-anchor='middle' fill='%23fff' font-family='sans-serif'%3E%EB%98%A5%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css?v=20261112f" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true">똥</span>
      <div>
        <h1>급해</h1>
        <p class="region" id="regionLabel">서울특별시</p>
      </div>
    </div>
    <label class="radius">
      반경
      <select id="radius">
        <option value="1">1m</option>
        <option value="2">2m</option>
        <option value="3">3m</option>
        <option value="4">4m</option>
        <option value="5" selected>5m</option>
      </select>
    </label>
  </header>

  <main class="layout">
    <section class="mapwrap">
      <div id="map" aria-label="주변 화장실 지도"></div>
      <button id="locate" class="fab" title="내 위치로">◎</button>
      <p class="hint">위치가 틀리면 파란 점을 끌거나 지도를 눌러 바로잡으세요</p>
    </section>

    <section class="panel">
      <button id="urgent" class="urgent">
        <strong>지금 가장 가까운 화장실</strong>
        <span id="urgentSub">위치 확인 중…</span>
      </button>

      <div class="filters" role="group" aria-label="필터">
        <label class="chip"><input type="checkbox" id="fFree" /> 무료</label>
        <label class="chip"><input type="checkbox" id="f24" /> 24시간</label>
        <label class="chip"><input type="checkbox" id="fAcc" /> 장애인</label>
        <label class="chip"><input type="checkbox" id="fBaby" /> 기저귀대</label>
      </div>

      <p id="status" class="status" role="status"></p>
      <ol id="list" class="list"></ol>
      <p class="source">데이터: 서울교통공사 역사공중화장실정보(공공데이터포털, 공공누리 제1유형), © OpenStreetMap 기여자. 실제 개방 여부는 현장 상황과 다를 수 있습니다.</p>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="js/app.js?v=20261112f"></script>
</body>
</html>
